<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IN-GRES AI - Indian Groundwater Resource Estimation AI Virtual Assistant. Ask questions about India's groundwater resources using text or voice."
    />
    <meta name="theme-color" content="#075985" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="IN-GRES AI" />
    <title>IN-GRES AI</title>
    <style>
      #ingres-initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(to bottom, hsl(199 89% 94% / 0.4), hsl(210 40% 98%), hsl(210 40% 98%));
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #ingres-initial-loader .loader-card {
        position: relative;
        width: 220px;
        height: 220px;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid hsl(214 32% 88%);
        background: linear-gradient(135deg, hsl(199 89% 40% / 0.08), hsl(0 0% 100%) 55%, hsl(199 89% 94% / 0.6));
        box-shadow: 0 4px 24px hsl(199 89% 40% / 0.08);
      }
      #ingres-initial-loader .loader-card::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: linear-gradient(to right, hsl(199 89% 40%), hsl(199 89% 55%), hsl(199 89% 40%));
      }
      #ingres-initial-loader iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: transparent;
        transform: scale(1.02);
      }
      #ingres-initial-loader .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #ingres-initial-loader .brand-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        background: hsl(199 89% 40%);
        color: white;
      }
      #ingres-initial-loader .brand-text {
        background: linear-gradient(to right, hsl(199 89% 40%), hsl(199 92% 45%));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #ingres-initial-loader .msg {
        text-align: center;
      }
      #ingres-initial-loader .msg-title {
        font-size: 14px;
        font-weight: 500;
        color: hsl(222 47% 11%);
      }
      #ingres-initial-loader .msg-sub {
        font-size: 12px;
        color: hsl(215 16% 47%);
        margin-top: 4px;
      }
      #ingres-initial-loader .dots {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-top: 10px;
      }
      #ingres-initial-loader .dots span {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: hsl(199 89% 40%);
        animation: ingres-bounce 0.9s infinite;
      }
      #ingres-initial-loader .dots span:nth-child(2) {
        background: hsl(199 89% 55%);
        animation-delay: 0.15s;
      }
      #ingres-initial-loader .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes ingres-bounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.6; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="ingres-initial-loader" aria-live="polite" aria-busy="true">
        <div class="loader-card">
          <iframe
            src="https://lottie.host/embed/711ab754-fd7e-4164-8770-d3aa7eccb854/hvZZsyFE0b.lottie"
            title="Loading animation"
            loading="eager"
            allow="autoplay; fullscreen"
          ></iframe>
        </div>
        <div class="brand">
          <span class="brand-icon">🌊</span>
          <span class="brand-text">IN-GRES AI</span>
          <span
            style="
              background: hsl(199 89% 94%);
              color: hsl(199 89% 30%);
              font-size: 10px;
              padding: 2px 8px;
              border-radius: 9999px;
              letter-spacing: 0.08em;
            "
            >GROUNDWATER</span
          >
        </div>
        <div class="msg">
          <div class="msg-title">Loading groundwater intelligence…</div>
          <div class="msg-sub">Preparing IN-GRES assessment data</div>
          <div class="dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
