# Render Blueprint for the IN-GRES AI FastAPI backend.
# Import this repo at https://dashboard.render.com/blueprints — Render reads
# this file and provisions the service automatically.
#
# Notes:
# - Free plan: service sleeps after 15 min idle (cold start ~50 s) and the
#   ephemeral disk resets the SQLite DB on every redeploy, so the national
#   seed runs on every boot.
# - SEED_DATASET=national covers ALL 36 states/UTs + ~911 districts so the
#   UI never shows missing states. SEED_VILLAGES_PER_DISTRICT caps the
#   generated village layer (~16k villages, ~30 MB DB, ~10 s seed) so boot
#   stays fast and the DB stays well under the free-tier disk/RAM limits (full ~550k-village layer
#   needs ~1.8 GB SQLite and would not fit).
services:
  - type: web
    name: ingres-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./deploy.db
      - key: ENABLE_GEOMETRY
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: SEED_DATASET
        value: national
      - key: SEED_VILLAGES_PER_DISTRICT
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_USER_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ingres-static.vercel.app
      - key: LLM_ENABLED
        value: "false"
      - key: LIVE_DATA_ENABLED
        value: "false"
      - key: SCHEDULED_REPORTS_ENABLED
        value: "false"
