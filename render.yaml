# Render Blueprint for the IN-GRES AI FastAPI backend.
# Import this repo at https://dashboard.render.com/blueprints — Render reads
# this file and provisions the service automatically.
#
# Notes:
# - Free plan: service sleeps after 15 min idle (cold start ~50 s) and the
#   ephemeral disk resets the SQLite DB on every redeploy.
# - SEED_DATASET=demo keeps first boot fast; switch to "national" for the
#   full all-India synthetic set (slower boot, more RAM).
services:
  - type: web
    name: ingres-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./deploy.db
      - key: ENABLE_GEOMETRY
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: SEED_DATASET
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_USER_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ingres-ai.vercel.app
      - key: LLM_ENABLED
        value: "false"
      - key: LIVE_DATA_ENABLED
        value: "false"
      - key: SCHEDULED_REPORTS_ENABLED
        value: "false"
